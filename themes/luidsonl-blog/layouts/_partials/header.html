<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4">
  <!-- Site Title -->
  <a href="{{ site.BaseURL }}" class="text-xl font-bold text-slate-900 dark:text-white hover:text-sky-600 dark:hover:text-sky-400 transition-colors duration-200 shrink-0">
    {{ site.Title }}
  </a>

  <!-- Navigation Menu -->
  {{ partial "menu.html" (dict "menuID" "main" "page" .) }}

  <!-- Dark Mode Toggle -->
  <button
    id="theme-toggle"
    aria-label="Toggle dark mode"
    class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-200 shrink-0 cursor-pointer"
  >
    <!-- Sun icon (shown in dark mode) -->
    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2M5.22 5.22l1.42 1.42M17.36 17.36l1.42 1.42M3 12h2m14 0h2M5.22 18.78l1.42-1.42M17.36 6.64l1.42-1.42M12 8a4 4 0 100 8 4 4 0 000-8z" />
    </svg>
    <!-- Moon icon (shown in light mode) -->
    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
    </svg>
  </button>
</div>
