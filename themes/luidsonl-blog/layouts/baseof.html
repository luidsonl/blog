<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen flex flex-col">

  {{ partial "top-bar.html" . }}

  <!-- Main Container -->
  <div class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950/40 py-8 mt-12 text-center text-sm text-slate-500 dark:text-slate-400">
    {{ partial "footer.html" . }}
  </footer>

</body>
</html>
