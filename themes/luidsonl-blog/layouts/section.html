{{ define "main" }}

  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white">{{ .Title }}</h1>
    {{- with .Content }}
      <div class="mt-2 text-slate-600 dark:text-slate-400 text-sm">{{ . }}</div>
    {{- end }}
  </div>

  {{- if .Pages }}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      {{- range .Pages }}
        {{ partial "post-card.html" . }}
      {{- end }}
    </div>
  {{- else }}
    <p class="text-slate-500 dark:text-slate-400 text-center py-12">
      {{ if eq .Lang "en" }}No posts found.{{ else }}Nenhum post encontrado.{{ end }}
    </p>
  {{- end }}

{{ end }}
